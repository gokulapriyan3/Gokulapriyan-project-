<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGenie - AI Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="hero">
  <div class="hero-content">
    <div class="logo">EG</div>
    <div>
      <h1>EduGenie</h1>
      <p>AI-Powered Learning Assistant</p>
    </div>
  </div>
</header>

<main class="container">
  <section class="card">
    <h2>Learn with EduGenie</h2>

    <label for="task">Choose a feature</label>
    <select id="task">
      <option value="qa">Question & Answer</option>
      <option value="explain">Topic Explanation</option>
      <option value="quiz">Quiz Generation</option>
      <option value="summarize">Text Summarization</option>
      <option value="learn">Personalized Learning Path</option>
    </select>

    <label for="inputText">Enter your question, topic, or text</label>
    <textarea id="inputText" rows="9"
      placeholder="Example: Explain object-oriented programming in simple English."></textarea>

    <div class="buttons">
      <button id="generateBtn">Generate</button>
      <button id="clearBtn" class="secondary">Clear</button>
      <a class="docs-button" href="/docs" target="_blank">API Docs</a>
    </div>
  </section>

  <section class="card">
    <div class="result-header">
      <h2>Result</h2>
      <span id="status" class="status">Ready</span>
    </div>
    <div id="result" class="result">Your AI-generated result will appear here.</div>
  </section>
</main>

<footer><p>EduGenie • Generative AI for Education</p></footer>
<script src="/static/app.js"></script>
</body>
</html>
